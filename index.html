<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impara le Lingue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌍 Impara le Lingue</h1>
    <p class="author">creato da Fabio Fiorini</p>
  </header>

  <main>
    <!-- 🔵 Lingue e livelli -->
    <section class="language-block">
      <h2>🇫🇷 Francese</h2>
      <div class="menu">
        <a class="btn" href="/fr-a1/">A1</a>
        <a class="btn" href="/fr-a2/">A2</a>
        <a class="btn" href="/fr-a3/">A3</a>
      </div>
    </section>

    <section class="language-block">
      <h2>🇬🇧 Inglese</h2>
      <div class="menu">
        <a class="btn" href="/en-a1/">A1</a>
        <a class="btn" href="/en-a2/">A2</a>
        <a class="btn" href="/en-a3/">A3</a>
      </div>
    </section>

    <section class="language-block">
      <h2>🇪🇸 Spagnolo</h2>
      <div class="menu">
        <a class="btn" href="/es-a1/">A1</a>
        <a class="btn" href="/es-a2/">A2</a>
        <a class="btn" href="/es-a3/">A3</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Progetto Impara le Lingue — Menu principale</p>
  </footer>

  <script>
    // 🔧 Ora non serve più selezionare il modello
    // Ogni pagina userà sempre gpt-4o-mini
    function getSelectedModel() {
      return "gpt-4o-mini";
    }

    // 🔧 Navigazione diretta senza query ?model=
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".menu a").forEach(link => {
        link.addEventListener("click", e => {
          e.preventDefault();
          const target = e.currentTarget.getAttribute("href");
          window.location.href = target; // niente più ?model=
        });
      });
    });
  </script>
</body>
</html>
